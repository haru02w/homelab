services:
  mc:
    image: itzg/minecraft-server:stable
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "MODRINTH"
      MODRINTH_MODPACK: "everything-voxy"
      VERSION: "26.2"
      MEMORY: "4096M"
      MOTD: "No man's land"
      ONLINE_MODE: "false"
      USE_MEOWICE_FLAGS: "true"
      TZ: "America/Sao_Paulo"
      DIFFICULTY: "2"
      ENABLE_COMMAND_BLOCK: "true"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "80"
      SIMULATION_DISTANCE: "6"
      VIEW_DISTANCE: "8"
      #LEVEL_TYPE: "large_biomes"
      REGION_FILE_COMPRESSION: "none"
      RESOURCE_PACK_ENFORCE: "true"
      MODRINTH_PROJECTS: |-
        datapack:veinminer
        datapack:veinminer-enchantment
        datapack:terratonic
        datapack:terralith
        datapack:remove-terralith-intro-message
        datapack:geophilic
        datapack:dungeons-and-taverns
        datapack:towns-and-towers
        datapack:trek:beta
        datapack:incendium:alpha
        datapack:dynamic-lights
        chunky
        balm
        jamlib
        krypton
        ksyxis
        voxy-server-side
        netherportalfix
        crashexploitfixer
        forgiving-void
        rightclickharvest
        worldedit
        carpet
        skinrestorer
        simple-voice-chat
    volumes:
      - "./data:/data"
